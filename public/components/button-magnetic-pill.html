<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magnetic Pill Buttons - cursor-attracted CTAs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Inter Tight"', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    .card { box-shadow: 0 1px 0 rgba(255,255,255,.9) inset, 0 1px 2px rgba(16,16,20,.05), 0 8px 24px -8px rgba(16,16,20,.12), 0 32px 64px -24px rgba(16,16,20,.18); }
    .field {
      background-image: radial-gradient(rgba(24,24,27,.13) 1px, transparent 1px);
      background-size: 18px 18px; background-position: center;
      -webkit-mask-image: radial-gradient(ellipse 65% 70% at 50% 50%, #000 35%, transparent 85%);
              mask-image: radial-gradient(ellipse 65% 70% at 50% 50%, #000 35%, transparent 85%);
    }
    [data-magnet] { position: relative; will-change: transform; touch-action: manipulation; }
    [data-magnet]::after {
      content: ''; position: absolute; inset: -12px; border-radius: 9999px; pointer-events: none;
      border: 1px dashed rgba(59,91,255,.45); opacity: var(--f, 0); transform: scale(calc(.85 + var(--f, 0) * .15));
    }
    [data-magnet-label] { display: inline-flex; align-items: center; gap: .55rem; will-change: transform; }
    [data-magnet]:focus-visible { outline: 2px solid #3b5bff; outline-offset: 4px; }
    input[type=range] { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 9999px; background: linear-gradient(90deg, #18181b var(--p, 50%), #e4e4e7 var(--p, 50%)); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 9999px; background: #fff; border: 1px solid #d4d4d8; box-shadow: 0 1px 3px rgba(0,0,0,.15); cursor: pointer; }
    input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 9999px; background: #fff; border: 1px solid #d4d4d8; box-shadow: 0 1px 3px rgba(0,0,0,.15); cursor: pointer; }
  </style>
</head>
<body class="min-h-screen grid place-items-center p-8 font-sans antialiased">
  <section class="card w-full max-w-4xl overflow-hidden rounded-3xl border border-zinc-200 bg-white text-zinc-900">
    <header class="flex flex-wrap items-end justify-between gap-4 px-6 pt-6 sm:px-9 sm:pt-8">
      <div>
        <span class="inline-flex items-center gap-1.5 rounded-full border border-zinc-200 bg-zinc-50 px-2.5 py-1 text-[11px] font-medium text-zinc-600">
          <iconify-icon icon="lucide:magnet" class="text-[12px] text-[#3b5bff]"></iconify-icon> Interaction
        </span>
        <h1 class="mt-3 text-[26px] font-semibold leading-tight tracking-[-0.03em]">Magnetic pills</h1>
        <p class="mt-1 max-w-md text-[14px] leading-relaxed text-zinc-500">Buttons lean toward the pointer and spring home, with the label drifting a little further for depth.</p>
      </div>
      <label class="flex items-center gap-3 rounded-full border border-zinc-200 bg-white px-4 py-2 text-[12px] font-medium text-zinc-600">
        Pull
        <input id="strength" type="range" min="0" max="100" value="55" class="w-28" aria-label="Magnet strength">
        <span id="strengthOut" class="w-7 text-right tabular-nums text-zinc-900">55</span>
      </label>
    </header>

    <div id="zone" class="relative mx-3 mt-6 rounded-2xl border border-zinc-100 bg-zinc-50/60 sm:mx-5">
      <div class="field pointer-events-none absolute inset-0"></div>
      <div class="relative flex min-h-[260px] flex-wrap items-center justify-center gap-x-9 gap-y-8 px-6 py-16">
        <button data-magnet data-strength="0.42" class="inline-flex h-14 items-center rounded-full bg-zinc-950 pl-6 pr-2 text-[15px] font-medium text-white shadow-[0_10px_24px_-10px_rgba(0,0,0,.55),inset_0_1px_0_rgba(255,255,255,.15)]">
          <span data-magnet-label class="mr-3">Get started</span>
          <span class="grid h-10 w-10 place-items-center rounded-full bg-white text-zinc-950"><iconify-icon icon="lucide:arrow-right" class="text-[17px]"></iconify-icon></span>
        </button>
        <button data-magnet data-strength="0.38" class="inline-flex h-14 items-center rounded-full border border-zinc-200 bg-white px-7 text-[15px] font-medium text-zinc-900 shadow-[0_1px_2px_rgba(0,0,0,.05),0_8px_20px_-12px_rgba(0,0,0,.2)]">
          <span data-magnet-label><iconify-icon icon="lucide:layout-grid" class="text-[16px] text-zinc-500"></iconify-icon>View showcase</span>
        </button>
        <button data-magnet data-strength="0.5" aria-label="Play intro" class="grid h-14 w-14 place-items-center rounded-full border border-zinc-200 bg-white text-zinc-900 shadow-[0_1px_2px_rgba(0,0,0,.05),0_8px_20px_-12px_rgba(0,0,0,.2)]">
          <span data-magnet-label><iconify-icon icon="lucide:play" class="ml-0.5 text-[18px]"></iconify-icon></span>
        </button>
        <button data-magnet data-strength="0.42" class="inline-flex h-14 items-center rounded-full bg-[#3b5bff] px-7 text-[15px] font-medium text-white shadow-[0_12px_28px_-10px_rgba(59,91,255,.7),inset_0_1px_0_rgba(255,255,255,.25)]">
          <span data-magnet-label><iconify-icon icon="lucide:zap" class="text-[16px]"></iconify-icon>Start free trial</span>
        </button>
      </div>
    </div>

    <footer class="flex flex-wrap items-center justify-between gap-3 px-6 py-5 text-[13px] text-zinc-500 sm:px-9">
      <span class="inline-flex items-center gap-2"><iconify-icon icon="lucide:mouse-pointer-2" class="text-[15px] text-zinc-400"></iconify-icon>Move your cursor near the buttons</span>
      <span id="readout" class="font-medium tabular-nums text-zinc-400">Field idle</span>
    </footer>
  </section>

  <script>
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var gain = 0.55;
      var slider = document.getElementById('strength');
      var out = document.getElementById('strengthOut');
      var readout = document.getElementById('readout');
      function syncSlider() { gain = slider.value / 100; out.textContent = slider.value; slider.style.setProperty('--p', slider.value + '%'); }
      slider.addEventListener('input', syncSlider); syncSlider();

      var items = Array.prototype.map.call(document.querySelectorAll('[data-magnet]'), function (el) {
        return { el: el, label: el.querySelector('[data-magnet-label]'), s: parseFloat(el.dataset.strength) || 0.4,
          x: 0, y: 0, vx: 0, vy: 0, lx: 0, ly: 0, vlx: 0, vly: 0, tx: 0, ty: 0, tlx: 0, tly: 0, f: 0 };
      });
      var px = -1e5, py = -1e5, raf = 0;
      function clamp(v, m) { return Math.max(-m, Math.min(m, v)); }

      function targets() {
        var active = 0;
        items.forEach(function (it) {
          var r = it.el.getBoundingClientRect();
          var cx = r.left + r.width / 2 - it.x, cy = r.top + r.height / 2 - it.y;
          var dx = px - cx, dy = py - cy, d = Math.hypot(dx, dy);
          var inner = Math.max(r.width, r.height) / 2, outer = inner + 90;
          var f = d <= inner ? 1 : Math.max(0, 1 - (d - inner) / (outer - inner));
          f = f * f * (3 - 2 * f);
          var k = reduce ? 0 : it.s * gain * 1.3 * f;
          var mx = 6 + 12 * gain, ml = 2 + 4 * gain;
          it.tx = clamp(dx * k, mx); it.ty = clamp(dy * k, mx * 0.75); it.tlx = clamp(dx * k * 0.35, ml); it.tly = clamp(dy * k * 0.35, ml * 0.6); it.f = f;
          if (f > 0.02) active++;
        });
        readout.textContent = active ? active + ' button' + (active > 1 ? 's' : '') + ' in range' : 'Field idle';
      }

      function tick() {
        var moving = false;
        items.forEach(function (it) {
          it.vx = (it.vx + (it.tx - it.x) * 0.16) * 0.74; it.vy = (it.vy + (it.ty - it.y) * 0.16) * 0.74;
          it.vlx = (it.vlx + (it.tlx - it.lx) * 0.14) * 0.72; it.vly = (it.vly + (it.tly - it.ly) * 0.14) * 0.72;
          it.x += it.vx; it.y += it.vy; it.lx += it.vlx; it.ly += it.vly;
          if (Math.abs(it.tx - it.x) + Math.abs(it.ty - it.y) + Math.abs(it.vx) + Math.abs(it.vy) + Math.abs(it.tlx - it.lx) + Math.abs(it.vlx) > 0.05) moving = true;
          it.el.style.transform = 'translate3d(' + it.x.toFixed(2) + 'px,' + it.y.toFixed(2) + 'px,0)';
          if (it.label) it.label.style.transform = 'translate3d(' + it.lx.toFixed(2) + 'px,' + it.ly.toFixed(2) + 'px,0)';
          it.el.style.setProperty('--f', (reduce ? 0 : it.f).toFixed(3));
        });
        raf = moving ? requestAnimationFrame(tick) : 0;
      }
      function kick() { targets(); if (!raf) raf = requestAnimationFrame(tick); }

      window.addEventListener('pointermove', function (e) { px = e.clientX; py = e.clientY; kick(); }, { passive: true });
      document.documentElement.addEventListener('pointerleave', function () { px = py = -1e5; kick(); });
      window.addEventListener('blur', function () { px = py = -1e5; kick(); });
      window.addEventListener('scroll', kick, { passive: true });
      items.forEach(function (it) {
        it.el.addEventListener('pointerdown', function () { it.vx *= 0.3; it.vy *= 0.3; it.el.style.scale = '0.97'; });
        ['pointerup', 'pointerleave'].forEach(function (ev) { it.el.addEventListener(ev, function () { it.el.style.scale = ''; }); });
      });
    })();
  </script>
</body>
</html>
