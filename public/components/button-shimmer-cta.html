<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shimmer CTA Buttons - shine sweep, shimmer border, loading state</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['Outfit', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    .shell { box-shadow: 0 1px 2px rgba(15,10,40,.06), 0 18px 50px -18px rgba(40,20,90,.28); }
    .hero-tile { background: radial-gradient(60% 90% at 15% 0%, rgba(129,140,248,.28), transparent 60%), radial-gradient(50% 80% at 90% 100%, rgba(232,121,249,.25), transparent 60%), linear-gradient(180deg, #faf9ff, #f6f3ff); }
    .cta { position: relative; overflow: hidden; isolation: isolate; background: linear-gradient(120deg, #4f46e5 0%, #7c3aed 45%, #c026d3 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 8px rgba(40,0,80,.25), 0 1px 2px rgba(60,20,120,.3), 0 14px 32px -12px rgba(147,51,234,.65); transition: transform .2s ease, box-shadow .2s ease; }
    .cta:hover { transform: translateY(-1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.4), inset 0 -3px 8px rgba(40,0,80,.25), 0 2px 4px rgba(60,20,120,.3), 0 20px 40px -12px rgba(147,51,234,.75); }
    .cta::after { content: ''; position: absolute; inset: -20% auto -20% 0; width: 34%; z-index: -1; pointer-events: none;
      background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,.08) 30%, rgba(255,255,255,.55) 50%, rgba(255,255,255,.08) 70%, transparent 100%);
      transform: translateX(-160%) skewX(-18deg); animation: sweep 3.6s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes sweep { 0% { transform: translateX(-160%) skewX(-18deg); } 55%, 100% { transform: translateX(360%) skewX(-18deg); } }
    .shimmer-border { border: 1px solid transparent;
      background: linear-gradient(#0f0d17, #0f0d17) padding-box, linear-gradient(100deg, #2a2735 0%, #2a2735 38%, #c4b5fd 47%, #f0abfc 52%, #2a2735 62%, #2a2735 100%) border-box;
      background-size: 100% 100%, 300% 100%; animation: shimmer 3s linear infinite; }
    @keyframes shimmer { from { background-position: 0 0, 100% 0; } to { background-position: 0 0, -50% 0; } }
    .shimmer-text { background: linear-gradient(100deg, #a1a1aa 0%, #fafafa 45%, #a1a1aa 60%); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer-t 3s linear infinite; }
    @keyframes shimmer-t { from { background-position: 100% 0; } to { background-position: -50% 0; } }
    .arrow-track { position: relative; width: 16px; height: 16px; overflow: hidden; display: inline-block; }
    .arrow-track > * { position: absolute; inset: 0; transition: transform .35s cubic-bezier(.65,0,.35,1); }
    .arrow-track > :last-child { transform: translateX(-130%); }
    .ghost:hover .arrow-track > :first-child, .ghost:focus-visible .arrow-track > :first-child { transform: translateX(130%); }
    .ghost:hover .arrow-track > :last-child, .ghost:focus-visible .arrow-track > :last-child { transform: translateX(0); }
    .spinner { width: 15px; height: 15px; border-radius: 9999px; border: 2px solid rgba(255,255,255,.25); border-top-color: #fff; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse-dot { box-shadow: 0 0 0 0 rgba(74,222,128,.6); animation: ping 2s ease-out infinite; }
    @keyframes ping { 70%, 100% { box-shadow: 0 0 0 6px rgba(74,222,128,0); } }
    button:focus-visible { outline: 2px solid #8b5cf6; outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      .cta::after, .shimmer-border, .shimmer-text, .pulse-dot { animation: none; }
      .shimmer-text { color: #f4f4f5; }
    }
  </style>
</head>
<body class="min-h-screen grid place-items-center p-8 font-sans antialiased">
  <section class="shell w-full max-w-4xl rounded-[30px] border border-zinc-200/80 bg-white p-2.5 text-zinc-900">
    <div class="grid gap-2.5 sm:grid-cols-3">
      <div class="hero-tile relative flex flex-col items-center justify-center gap-5 overflow-hidden rounded-[22px] border border-violet-100 px-6 py-14 sm:col-span-3">
        <span class="absolute left-5 top-4 text-[11px] font-medium uppercase tracking-[0.16em] text-violet-400">01 / Shine sweep</span>
        <button class="cta inline-flex h-14 items-center gap-3 rounded-2xl px-8 text-[17px] font-medium tracking-tight text-white">
          <iconify-icon icon="lucide:sparkles" class="text-[18px]"></iconify-icon>
          Start building for free
          <iconify-icon icon="lucide:arrow-right" class="text-[18px] opacity-80"></iconify-icon>
        </button>
        <p class="flex flex-wrap items-center justify-center gap-x-4 gap-y-1 text-[13px] text-zinc-500">
          <span class="inline-flex items-center gap-1.5"><iconify-icon icon="lucide:check" class="text-violet-500"></iconify-icon>No credit card</span>
          <span class="inline-flex items-center gap-1.5"><iconify-icon icon="lucide:check" class="text-violet-500"></iconify-icon>14-day Pro trial</span>
          <span class="inline-flex items-center gap-1.5"><iconify-icon icon="lucide:check" class="text-violet-500"></iconify-icon>Cancel anytime</span>
        </p>
      </div>

      <div class="relative flex min-h-[190px] flex-col items-center justify-center overflow-hidden rounded-[22px] border border-zinc-800 bg-[#09080d] px-5 pb-8 pt-12">
        <div class="pointer-events-none absolute -bottom-16 left-1/2 h-32 w-48 -translate-x-1/2 rounded-full bg-violet-600/25 blur-3xl"></div>
        <span class="absolute left-5 top-4 text-[11px] font-medium uppercase tracking-[0.16em] text-zinc-500">02 / Shimmer border</span>
        <button class="shimmer-border relative inline-flex h-11 items-center gap-2.5 rounded-full px-5 text-[14px] font-medium">
          <span class="pulse-dot h-1.5 w-1.5 rounded-full bg-green-400"></span>
          <span class="shimmer-text">Join the private beta</span>
        </button>
      </div>

      <div class="relative flex min-h-[190px] flex-col items-center justify-center rounded-[22px] border border-zinc-200 bg-zinc-50 px-5 pb-8 pt-12">
        <span class="absolute left-5 top-4 text-[11px] font-medium uppercase tracking-[0.16em] text-zinc-400">03 / Ghost</span>
        <button class="ghost inline-flex h-11 items-center gap-2 rounded-full px-5 text-[14px] font-medium text-zinc-700 transition-colors hover:bg-zinc-200/60 hover:text-zinc-950">
          Read the docs
          <span class="arrow-track" aria-hidden="true">
            <iconify-icon icon="lucide:arrow-right" class="text-[16px]"></iconify-icon>
            <iconify-icon icon="lucide:arrow-right" class="text-[16px]"></iconify-icon>
          </span>
        </button>
      </div>

      <div class="relative flex min-h-[190px] flex-col items-center justify-center rounded-[22px] border border-zinc-200 bg-white px-5 pb-8 pt-12">
        <span class="absolute left-5 top-4 text-[11px] font-medium uppercase tracking-[0.16em] text-zinc-400">04 / Async state</span>
        <button id="publish" class="inline-flex h-11 min-w-[176px] items-center justify-center gap-2 rounded-xl bg-zinc-900 px-5 text-[14px] font-medium text-white shadow-[inset_0_1px_0_rgba(255,255,255,.12),0_8px_20px_-10px_rgba(0,0,0,.5)] transition-colors duration-300" aria-live="polite">
          <iconify-icon icon="lucide:upload-cloud" class="text-[16px]"></iconify-icon>
          <span>Publish site</span>
        </button>
        <p id="publishHint" class="absolute bottom-3 text-[12px] text-zinc-400">Click to publish</p>
      </div>
    </div>
  </section>

  <script>
    (function () {
      var btn = document.getElementById('publish');
      var hint = document.getElementById('publishHint');
      var idle = btn.innerHTML;
      var state = 'idle';
      btn.addEventListener('click', function () {
        if (state !== 'idle') return;
        state = 'loading';
        btn.setAttribute('aria-busy', 'true');
        btn.innerHTML = '<span class="spinner"></span><span>Publishing</span>';
        btn.classList.add('cursor-wait');
        hint.textContent = 'Optimizing 14 assets';
        setTimeout(function () {
          state = 'done';
          btn.removeAttribute('aria-busy');
          btn.classList.remove('cursor-wait', 'bg-zinc-900');
          btn.classList.add('bg-emerald-600');
          btn.innerHTML = '<iconify-icon icon="lucide:check-circle-2" class="text-[16px]"></iconify-icon><span>Published</span>';
          hint.textContent = 'fernhill-labs.aura.site';
          setTimeout(function () {
            btn.classList.remove('bg-emerald-600');
            btn.classList.add('bg-zinc-900');
            btn.innerHTML = idle;
            hint.textContent = 'Click to publish';
            state = 'idle';
          }, 2000);
        }, 1300);
      });
    })();
  </script>
</body>
</html>
