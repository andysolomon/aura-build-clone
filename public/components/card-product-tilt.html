<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Tilt Cards - 3D perspective hardware cards with glare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { fontFamily: { sans: ['"Space Grotesk"', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };
  </script>
  <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
  <style>
    .tilt { transform-style: preserve-3d; transition: transform .6s cubic-bezier(.2,.8,.2,1), box-shadow .4s; will-change: transform;
      box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 18px 40px -18px rgba(0,0,0,.35); }
    .tilt.is-active { transition: transform .12s linear, box-shadow .4s; box-shadow: 0 2px 4px rgba(0,0,0,.08), 0 30px 60px -20px rgba(0,0,0,.45); }
    .glare { position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: 0; transition: opacity .4s; transform: translateZ(70px) scale(.94);
      background: radial-gradient(360px circle at var(--gx, 50%) var(--gy, 50%), rgba(255,255,255,.28), rgba(255,255,255,.06) 40%, transparent 65%); }
    .tilt.is-active .glare { opacity: 1; }
    .tile { background: var(--tile); transition: background .5s ease; transform: translateZ(18px); }
    .pop { transform: translateZ(56px); transition: filter .4s; }
    .shadow-ellipse { background: radial-gradient(closest-side, rgba(0,0,0,.35), transparent); }
    .sw { box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); transition: transform .2s; }
    .sw[aria-checked=true] { box-shadow: 0 0 0 2px var(--ring, #fff), 0 0 0 3.5px currentColor; }
    .sw:hover { transform: scale(1.12); }
    .bag-btn[aria-pressed=true] { background: #16a34a; color: #fff; border-color: transparent; }
    .case { background: linear-gradient(170deg, var(--p1), var(--p2)); box-shadow: inset 0 2px 1px rgba(255,255,255,.7), inset 0 -10px 18px rgba(0,0,0,.18), 0 18px 30px -10px rgba(0,0,0,.4); }
    .lamp-ring { background: conic-gradient(from 200deg, var(--p1), var(--p2), var(--p1)); -webkit-mask: radial-gradient(closest-side, transparent 72%, #000 73%); mask: radial-gradient(closest-side, transparent 72%, #000 73%); }
    .lamp-glow { background: radial-gradient(closest-side, var(--glow), transparent); }
    button:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) { .tilt, .tilt.is-active, .tile { transition: none; } }
  </style>
</head>
<body class="min-h-screen grid place-items-center p-8 font-sans antialiased">
  <main class="w-full max-w-5xl">
    <div class="mb-5 flex flex-wrap items-center justify-between gap-3 rounded-2xl border border-zinc-200 bg-white px-4 py-3 shadow-[0_1px_2px_rgba(0,0,0,.05)]">
      <div class="flex items-center gap-2.5">
        <span class="grid h-8 w-8 place-items-center rounded-lg bg-zinc-900 text-white"><iconify-icon icon="lucide:cpu" class="text-[15px]"></iconify-icon></span>
        <div class="leading-tight"><p class="text-[14px] font-semibold text-zinc-900">Autumn hardware drop</p><p class="text-[12px] text-zinc-500">Three objects, made to be touched</p></div>
      </div>
      <span class="inline-flex items-center gap-2 rounded-full border border-zinc-200 bg-zinc-50 px-3 py-1.5 text-[13px] font-medium text-zinc-700">
        <iconify-icon icon="lucide:shopping-bag" class="text-[15px]"></iconify-icon>Bag <span id="bagCount" class="grid h-5 min-w-5 place-items-center rounded-full bg-zinc-900 px-1.5 text-[11px] text-white tabular-nums">0</span>
      </span>
    </div>

    <div class="scene grid gap-5 sm:grid-cols-3">
      <!-- Aero One -->
      <article class="tilt relative rounded-[26px] border border-zinc-200 bg-white p-2.5 text-zinc-900" data-tilt style="--tile:linear-gradient(150deg,#eef2ff,#c7d2fe);--p1:#ffffff;--p2:#e4e4e7">
        <div class="tile relative grid aspect-[5/4] place-items-center overflow-hidden rounded-[20px]">
          <span class="absolute left-3 top-3 rounded-full bg-white/70 px-2 py-0.5 text-[11px] font-semibold text-zinc-700 backdrop-blur">New</span>
          <div class="pop relative">
            <div class="case relative h-[96px] w-[132px] rounded-[44px/50px]">
              <div class="absolute inset-x-0 top-[36%] h-px bg-black/15"></div>
              <div class="absolute inset-x-0 top-[calc(36%+1px)] h-px bg-white/60"></div>
              <div class="absolute bottom-[26%] left-1/2 h-1.5 w-1.5 -translate-x-1/2 rounded-full bg-emerald-400 shadow-[0_0_8px_2px_rgba(52,211,153,.7)]"></div>
            </div>
            <div class="shadow-ellipse absolute -bottom-5 left-1/2 h-5 w-36 -translate-x-1/2"></div>
          </div>
        </div>
        <div class="px-2.5 pb-2 pt-4">
          <div class="flex items-baseline justify-between"><h2 class="text-[19px] font-semibold tracking-tight">Aero One</h2><span class="text-[17px] font-semibold tabular-nums">$179</span></div>
          <p class="mt-0.5 text-[13px] text-zinc-500">Open-fit earbuds, 38-hour case</p>
          <div class="mt-4 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2" role="radiogroup" aria-label="Aero One color">
              <button class="sw h-5 w-5 rounded-full text-zinc-900" style="background:#f4f4f5" role="radio" aria-checked="true" aria-label="Chalk" data-tile="linear-gradient(150deg,#eef2ff,#c7d2fe)" data-p1="#ffffff" data-p2="#e4e4e7"></button>
              <button class="sw h-5 w-5 rounded-full text-zinc-900" style="background:#3f3f46" role="radio" aria-checked="false" aria-label="Graphite" data-tile="linear-gradient(150deg,#52525b,#18181b)" data-p1="#71717a" data-p2="#27272a"></button>
              <button class="sw h-5 w-5 rounded-full text-zinc-900" style="background:#a7c4a0" role="radio" aria-checked="false" aria-label="Sage" data-tile="linear-gradient(150deg,#ecfccb,#a7d7a0)" data-p1="#f0f7ec" data-p2="#b9d4b1"></button>
              <span class="ml-1 text-[12px] text-zinc-500" data-color-name>Chalk</span>
            </div>
            <button class="bag-btn inline-flex h-9 items-center gap-1.5 rounded-full border border-zinc-900 bg-zinc-900 px-3.5 text-[13px] font-medium text-white transition-colors" aria-pressed="false"><iconify-icon icon="lucide:plus" class="text-[14px]"></iconify-icon><span>Add to bag</span></button>
          </div>
        </div>
        <div class="glare"></div>
      </article>

      <!-- Halo Lamp -->
      <article class="tilt relative rounded-[26px] border border-white/10 bg-[#0d0d10] p-2.5 text-white" data-tilt style="--tile:radial-gradient(120% 90% at 50% 20%,#7c2d12,#1c0a05 75%);--p1:#fdba74;--p2:#f97316;--glow:rgba(251,146,60,.65);--ring:#0d0d10">
        <div class="tile relative grid aspect-[5/4] place-items-center overflow-hidden rounded-[20px]">
          <span class="absolute left-3 top-3 rounded-full bg-white/10 px-2 py-0.5 text-[11px] font-semibold text-white/80 ring-1 ring-inset ring-white/15">Bestseller</span>
          <div class="pop relative flex flex-col items-center">
            <div class="lamp-glow absolute -top-8 h-44 w-44"></div>
            <div class="relative h-[104px] w-[104px]">
              <div class="lamp-ring absolute inset-0 rounded-full"></div>
              <div class="absolute inset-[14px] rounded-full border border-white/10"></div>
            </div>
            <div class="h-10 w-1.5 rounded-b bg-gradient-to-b from-zinc-400 to-zinc-600"></div>
            <div class="h-3 w-24 rounded-[50%] bg-gradient-to-b from-zinc-500 to-zinc-800 shadow-[0_8px_16px_rgba(0,0,0,.6)]"></div>
          </div>
        </div>
        <div class="px-2.5 pb-2 pt-4">
          <div class="flex items-baseline justify-between"><h2 class="text-[19px] font-semibold tracking-tight">Halo Lamp</h2><span class="text-[17px] font-semibold tabular-nums">$129</span></div>
          <p class="mt-0.5 text-[13px] text-zinc-400">Circadian desk light, 2,700-6,500K</p>
          <div class="mt-4 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2" role="radiogroup" aria-label="Halo Lamp color">
              <button class="sw h-5 w-5 rounded-full text-white" style="background:#f97316" role="radio" aria-checked="true" aria-label="Ember" data-tile="radial-gradient(120% 90% at 50% 20%,#7c2d12,#1c0a05 75%)" data-p1="#fdba74" data-p2="#f97316" data-glow="rgba(251,146,60,.65)"></button>
              <button class="sw h-5 w-5 rounded-full text-white" style="background:#38bdf8" role="radio" aria-checked="false" aria-label="Glacier" data-tile="radial-gradient(120% 90% at 50% 20%,#0c4a6e,#030a14 75%)" data-p1="#bae6fd" data-p2="#0ea5e9" data-glow="rgba(56,189,248,.6)"></button>
              <button class="sw h-5 w-5 rounded-full text-white" style="background:#d946ef" role="radio" aria-checked="false" aria-label="Orchid" data-tile="radial-gradient(120% 90% at 50% 20%,#701a75,#14041a 75%)" data-p1="#f5d0fe" data-p2="#c026d3" data-glow="rgba(217,70,239,.6)"></button>
              <span class="ml-1 text-[12px] text-zinc-400" data-color-name>Ember</span>
            </div>
            <button class="bag-btn inline-flex h-9 items-center gap-1.5 rounded-full border border-white bg-white px-3.5 text-[13px] font-medium text-zinc-900 transition-colors" aria-pressed="false"><iconify-icon icon="lucide:plus" class="text-[14px]"></iconify-icon><span>Add to bag</span></button>
          </div>
        </div>
        <div class="glare"></div>
      </article>

      <!-- Pulse Band -->
      <article class="tilt relative rounded-[26px] border border-zinc-200 bg-white p-2.5 text-zinc-900" data-tilt style="--tile:linear-gradient(150deg,#f1f5f9,#cbd5e1);--p1:#e2e8f0;--p2:#64748b">
        <div class="tile relative grid aspect-[5/4] place-items-center overflow-hidden rounded-[20px]">
          <span class="absolute left-3 top-3 rounded-full bg-white/70 px-2 py-0.5 text-[11px] font-semibold text-zinc-700 backdrop-blur">Pre-order</span>
          <div class="pop relative">
            <svg viewBox="0 0 200 140" class="h-[124px] w-[178px] drop-shadow-[0_16px_14px_rgba(0,0,0,.25)]" aria-hidden="true">
              <defs>
                <linearGradient id="bandA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--p1)"/><stop offset="1" style="stop-color:var(--p2)"/></linearGradient>
                <linearGradient id="bandB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--p2)"/><stop offset="1" style="stop-color:var(--p1)"/></linearGradient>
              </defs>
              <ellipse cx="100" cy="80" rx="76" ry="40" fill="none" stroke="url(#bandB)" stroke-width="16"/>
              <ellipse cx="100" cy="66" rx="76" ry="40" fill="none" stroke="url(#bandA)" stroke-width="16"/>
              <ellipse cx="100" cy="66" rx="83" ry="47" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.2"/>
              <rect x="88" y="98" width="24" height="9" rx="4.5" fill="#0f172a" fill-opacity=".85"/>
              <circle cx="95" cy="102.5" r="1.8" fill="#4ade80"/><circle cx="105" cy="102.5" r="1.8" fill="#f87171"/>
            </svg>
          </div>
        </div>
        <div class="px-2.5 pb-2 pt-4">
          <div class="flex items-baseline justify-between"><h2 class="text-[19px] font-semibold tracking-tight">Pulse Band</h2><span class="text-[17px] font-semibold tabular-nums">$299</span></div>
          <p class="mt-0.5 text-[13px] text-zinc-500">Sleep and recovery ring, 7-day battery</p>
          <div class="mt-4 flex items-center justify-between gap-2">
            <div class="flex items-center gap-2" role="radiogroup" aria-label="Pulse Band color">
              <button class="sw h-5 w-5 rounded-full text-zinc-900" style="background:linear-gradient(135deg,#e2e8f0,#64748b)" role="radio" aria-checked="true" aria-label="Titanium" data-tile="linear-gradient(150deg,#f1f5f9,#cbd5e1)" data-p1="#e2e8f0" data-p2="#64748b"></button>
              <button class="sw h-5 w-5 rounded-full text-zinc-900" style="background:linear-gradient(135deg,#fde2d3,#c2795a)" role="radio" aria-checked="false" aria-label="Rose gold" data-tile="linear-gradient(150deg,#fff1eb,#f5c6b3)" data-p1="#fde2d3" data-p2="#b4674a"></button>
              <button class="sw h-5 w-5 rounded-full text-zinc-900" style="background:linear-gradient(135deg,#475569,#0f172a)" role="radio" aria-checked="false" aria-label="Midnight" data-tile="linear-gradient(150deg,#334155,#020617)" data-p1="#64748b" data-p2="#0f172a"></button>
              <span class="ml-1 text-[12px] text-zinc-500" data-color-name>Titanium</span>
            </div>
            <button class="bag-btn inline-flex h-9 items-center gap-1.5 rounded-full border border-zinc-900 bg-zinc-900 px-3.5 text-[13px] font-medium text-white transition-colors" aria-pressed="false"><iconify-icon icon="lucide:plus" class="text-[14px]"></iconify-icon><span>Add to bag</span></button>
          </div>
        </div>
        <div class="glare"></div>
      </article>
    </div>
  </main>

  <script>
    (function () {
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var finePointer = window.matchMedia('(hover: hover)').matches;
      document.querySelectorAll('[data-tilt]').forEach(function (card) {
        var raf = 0, ev = null;
        function apply() {
          raf = 0;
          var r = card.getBoundingClientRect();
          var x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height;
          x = Math.min(1, Math.max(0, x)); y = Math.min(1, Math.max(0, y));
          card.style.transform = 'perspective(1000px) rotateX(' + ((0.5 - y) * 14).toFixed(2) + 'deg) rotateY(' + ((x - 0.5) * 18).toFixed(2) + 'deg) scale(1.025)';
          card.style.setProperty('--gx', (x * 100).toFixed(1) + '%');
          card.style.setProperty('--gy', (y * 100).toFixed(1) + '%');
        }
        if (!reduce && finePointer) {
          card.addEventListener('pointerenter', function () { card.classList.add('is-active'); });
          card.addEventListener('pointermove', function (e) { ev = e; if (!raf) raf = requestAnimationFrame(apply); });
          card.addEventListener('pointerleave', function () {
            if (raf) { cancelAnimationFrame(raf); raf = 0; }
            card.classList.remove('is-active'); card.style.transform = '';
          });
        }

        var swatches = card.querySelectorAll('.sw');
        var nameEl = card.querySelector('[data-color-name]');
        swatches.forEach(function (sw) {
          sw.addEventListener('click', function () {
            swatches.forEach(function (o) { o.setAttribute('aria-checked', String(o === sw)); });
            card.style.setProperty('--tile', sw.dataset.tile);
            card.style.setProperty('--p1', sw.dataset.p1);
            card.style.setProperty('--p2', sw.dataset.p2);
            if (sw.dataset.glow) card.style.setProperty('--glow', sw.dataset.glow);
            nameEl.textContent = sw.getAttribute('aria-label');
          });
        });
      });

      var bagCount = document.getElementById('bagCount');
      document.querySelectorAll('.bag-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var on = btn.getAttribute('aria-pressed') !== 'true';
          btn.setAttribute('aria-pressed', String(on));
          btn.querySelector('iconify-icon').setAttribute('icon', on ? 'lucide:check' : 'lucide:plus');
          btn.querySelector('span').textContent = on ? 'Added' : 'Add to bag';
          bagCount.textContent = document.querySelectorAll('.bag-btn[aria-pressed=true]').length;
        });
      });
    })();
  </script>
</body>
</html>
